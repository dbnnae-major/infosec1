name: Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-sast:
    name: Tests + SAST (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run API integration tests
        run: bash ./mvnw -B -ntp clean verify
      - name: Run SpotBugs and fail on findings
        run: bash ./mvnw -B -ntp spotbugs:spotbugs spotbugs:check
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/spotbugs.html
          if-no-files-found: warn

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache NVD vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/odc-data
          key: odc-nvd-${{ runner.os }}-v1
      - name: Compile project
        run: bash ./mvnw -B -ntp -DskipTests package
      - name: Scan third-party libraries (CVSS >= 9 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B -ntp dependency-check:check
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
